version: '3.8'

services:
  db:
    image: postgres:15
    container_name: url_shortener_db
    restart: always
    environment:
      POSTGRES_USER: urluser
      POSTGRES_PASSWORD: urlpass
      POSTGRES_DB: urlshortener
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  web:
    build: ./backend
    container_name: url_shortener_web
    restart: always
    depends_on:
      - db
    environment:
      FLASK_ENV: production
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: url_shortener_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - web
    networks:
      - app_network

volumes:
  pgdata:

networks:
  app_network:
    driver: bridge
