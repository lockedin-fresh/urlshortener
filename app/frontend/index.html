<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URL Shortener</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 80px auto;
      text-align: center;
    }
    input {
      width: 70%;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-size: 16px;
    }
    #result a {
      color: #0066cc;
    }
  </style>
</head>
<body>
  <h2>URL Shortener</h2>
  <input type="text" id="longUrl" placeholder="Paste a long URL here">
  <button onclick="shortenUrl()">Shorten</button>
  <div id="result"></div>

  <script>
    async function shortenUrl() {
      const longUrl = document.getElementById('longUrl').value;
      const resultDiv = document.getElementById('result');

      if (!longUrl) {
        resultDiv.innerText = "Please enter a URL.";
        return;
      }

      try {
        const response = await fetch('/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: longUrl })
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.innerHTML = `Short URL: <a href="${data.short_url}" target="_blank">${data.short_url}</a>`;
        } else {
          resultDiv.innerText = `Error: ${data.error}`;
        }
      } catch (err) {
        resultDiv.innerText = "Something went wrong. Is the server running?";
      }
    }
  </script>
</body>
</html>
